name: CI

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out and test (branch, tag, or SHA)"
        required: false
        default: "haiku-with-llvm-shared"
      force-install:
        description: "Reinstall system disk, even when it was found in our cache"
        required: false
        default: false
        type: boolean

concurrency:
  group: haiku-build-and-test
  cancel-in-progress: true

env:
  HAIKU_NIGHTLY_VERSION: hrev60069
  HAIKU_LTS_VERSION: r1beta6
  PONY_LLVM_LIBS_HREV: hrev60069
  PRESET_DEBUG: 'x86-64-debug'
  PRESET_RELEASE: 'x86-64-release'

jobs:
  # Copy node version numbers found in env into output variables, that can be used in strategy matrixes.
  haikuversions:
    runs-on: ubuntu-latest
    outputs:
      HAIKU_LTS_VERSION: ${{ env.HAIKU_LTS_VERSION }}
      HAIKU_NIGHTLY_VERSION: ${{ env.HAIKU_NIGHTLY_VERSION }}
    steps:
      - name: "Prepare Haiku versions for use in matrix"
        run: |
          echo "HAIKU_LTS_VERSION=${{ env.HAIKU_LTS_VERSION }}" >> $GITHUB_OUTPUT
          echo "HAIKU_NIGHTLY_VERSION=${{ env.HAIKU_NIGHTLY_VERSION }}" >> $GITHUB_OUTPUT

  build:
    # Env variables are not available for strategy matrix, so we need to depend on output variables.
    needs: haikuversions

    strategy:
      # Run 2 max at the same time to avoid overwriting VM caches
      max-parallel: 2
      # WARNING: remember to keep this matrix in sync with the one for `upload` job
      #          (that's being run after this one and `publish` jobs are done).
      matrix:
        haiku-version: ["${{ needs.haikuversions.outputs.HAIKU_NIGHTLY_VERSION }}", "${{ needs.haikuversions.outputs.HAIKU_LTS_VERSION }}"]
        os-llvm: ['ON', 'OFF']

    name: Build Haiku ${{ matrix.haiku-version }}, ${{ matrix.os-llvm == 'ON' && 'shared' || 'static' }} LLVM

    runs-on: ubuntu-latest

    outputs:
      VERSION: ${{ steps.buildsetup.outputs.VERSION }}
      PACKAGE: ${{ steps.buildsetup.outputs.PACKAGE }}
      PACKAGE_REVISION: ${{ steps.buildsetup.outputs.PACKAGE_REVISION }}

    env:
      HAIKU_VERSION: ${{ matrix.haiku-version }}
      PONY_USE_OS_LLVM: ${{ matrix.os-llvm }}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v7
        with:
          # fetch tags, so we can calculate package revision number
          fetch-tags: 'true'

      - name: Get ponyc
        run: git clone --depth 1 --single-branch --branch ${{ inputs.ref || 'haiku-with-llvm-shared' }} https://github.com/ahwayakchih/ponyc.git && ls -la

      - name: Create source for LIBS_TAG
        run: |
          echo $PONY_LLVM_LIBS_HREV >haiku_libs_tag.source
          echo $PONY_USE_OS_LLVM >>haiku_libs_tag.source
          sha256sum \
            ponyc/lib/CMakePresets.json \
            ponyc/CMakeLists.txt \
            ponyc/lib/CMakeLists.txt \
            ponyc/lib/build-libs.cmake \
            ponyc/lib/llvm/patches/* \
            >>haiku_libs_tag.source

      - name: Get Ponyc VERSION, prepare PACKAGE name
        id: buildsetup
        run: |
          export VERSION=$(cat ponyc/VERSION)
          echo version is $VERSION
          echo VERSION=$VERSION >> $GITHUB_OUTPUT

          lasttag=$(git tag -l "v$VERSION*" --sort=-version:refname | head -n1)
          export PACKAGE_REVISION=$(echo ${lasttag:-0.0-0} | cut -d '-' -f2 | xargs -I '{}' echo '{}+1' | bc || echo 1)
          echo revision is $PACKAGE_REVISION
          echo PACKAGE_REVISION=$PACKAGE_REVISION >> $GITHUB_OUTPUT

          LLVM_INFO=
          if [ "$PONY_USE_OS_LLVM" != "ON" ] ; then
            LLVM_INFO="-static"
          fi
          export PACKAGE=ponyc-$VERSION-$PACKAGE_REVISION-$HAIKU_VERSION-x86_64$LLVM_INFO
          echo package is $PACKAGE
          echo PACKAGE=$PACKAGE >> $GITHUB_OUTPUT

      # This step is from ponyc's workflow
      - name: Check libs cache
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('haiku_libs_tag.source') }}
        run: |
          # The libs live in the VM but the .libs-cache-miss marker and its gate
          # live on the host, so the decision has to happen here, before the VM
          # boots. Off main (a manual dispatch of a branch): build LLVM in the VM if
          # it isn't cached (hit=false; the "Build libs" step pushes it). On main (a
          # scheduled run, or a dispatch left on main): if it isn't cached, write
          # the marker and skip -- we don't build LLVM on main.
          cd ponyc
          if python3 .ci-scripts/libs-cache/oci_libs_cache.py exists --platform haiku --tag "$LIBS_TAG"; then
            echo "Libs present in the main GHCR cache."
            echo "hit=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.ref }}" != "haiku" ]; then
            if python3 .ci-scripts/libs-cache/branch_libs_cache.py exists --platform haiku --tag "$LIBS_TAG"; then
              echo "Libs present in the branch GHCR cache."
              echo "hit=true" >> "$GITHUB_OUTPUT"
            else
              echo "Off-main manual run, cache miss; the VM will build LLVM."
              echo "hit=false" >> "$GITHUB_OUTPUT"
            fi
          else
            touch .libs-cache-miss
          fi

      - name: Create source for SYSTEM_TAG
        run: |
          echo $HAIKU_VERSION >haiku_system_tag.source
          sha256sum \
            ponyc/.ci-scripts/haiku/haiku-guest-installer.bash \
            ponyc/.ci-scripts/haiku/haiku-provision.bash \
            ponyc/.ci-scripts/haiku/haiku_configure_vm.py \
            >>haiku_libs_tag.source

      # Avoid burdening Haiku project by caching ISO and configured system disk
      - name: Restore Haiku system disk and ISO from our own cache
        id: haiku-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ format('{0}/vm-artifacts/haiku.iso', runner.temp) }}
            ${{ format('{0}/vm-artifacts/haiku_system.qcow2', runner.temp) }}
            haiku_vm_key*
          key: ${{ format('{0}-{1}', env.HAIKU_VERSION, hashFiles('haiku_system_tag.source')) }}

      - name: Force reinstall by removing cached system disk
        if: ${{ inputs.force-install }}
        run: rm -f "${{ runner.temp }}/vm-artifacts/haiku_system.qcow2"

      - name: Provision VM
        id: haiku-provision
        run: |
          export GITHUB_WORKSPACE=${GITHUB_WORKSPACE}/ponyc
          bash ponyc/.ci-scripts/haiku/haiku-provision.bash

      - name: Store Haiku ISO and system disk in our own cache
        if: ${{ inputs.force-install || steps.haiku-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ format('{0}/vm-artifacts/haiku.iso', runner.temp) }}
            ${{ format('{0}/vm-artifacts/haiku_system.qcow2', runner.temp) }}
            haiku_vm_key*
          key: ${{ steps.haiku-cache.outputs.cache-primary-key }}

      # This step is from ponyc's workflow
      # It will not restore anything, but tests to see if haiku-libs-cache.bash does not crash
      - name: Restore libs
        if: ${{ hashFiles('ponyc/.libs-cache-miss') == '' && steps.check.outputs.hit == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('haiku_libs_tag.source') }}
        run: bash ponyc/.ci-scripts/haiku/haiku-libs-cache.bash restore

      # Our own cache of libs
      - name: Restore libs.zip from our own cache
        id: libs-cache
        uses: actions/cache/restore@v6
        with:
          path: libs.zip
          key: ${{ hashFiles('haiku_libs_tag.source') }}

      # Our own restore of libs
      - name: Restore libs from libs.zip
        if: ${{ steps.libs-cache.outputs.cache-hit == 'true' }}
        run: |
          set -e
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -i haiku_vm_key -P 2222 ./libs.zip user@localhost:/boot/home/Desktop/libs.zip
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -i haiku_vm_key -p 2222 user@localhost /bin/sh <<'EOF'
            set -e
            cd /Data/ponyc
            unzip /boot/home/Desktop/libs.zip
          EOF

      # This step is from ponyc's workflow
      # It will build libs, but will not cache them, as that needs permission to store stuff in ghcr
      - name: Build libs
        if: ${{ steps.libs-cache.outputs.cache-hit != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBS_TAG: ${{ hashFiles('haiku_libs_tag.source') }}
        # When off main and the libs aren't cached, build LLVM in the VM (hours)
        # and push it to the branch cache, so a re-dispatch reuses the build.
        run: bash ponyc/.ci-scripts/haiku/haiku-libs-cache.bash build-push-branch

      # We keep our own libs cache
      - name: Cache libs
        if: ${{ steps.libs-cache.outputs.cache-hit != 'true' }}
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -i haiku_vm_key -p 2222 user@localhost /bin/sh <<'EOF'
            set -e
            cd /Data/ponyc
            zip -r -y /boot/home/Desktop/libs.zip build/libs lib/llvm/src/compiler-rt/lib/builtins
          EOF
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -i haiku_vm_key -P 2222 user@localhost:/boot/home/Desktop/libs.zip ./libs.zip

      - name: Store libs.zip in our custom cache
        if: ${{ steps.libs-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: libs.zip
          key: ${{ steps.libs-cache.outputs.cache-primary-key }}

      - name: Build and test
        env:
          PONY_USES: ${{ env.PONY_USE_OS_LLVM == 'ON' && 'os_llvm' || '' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -i haiku_vm_key -p 2222 user@localhost /bin/sh <<'EOF'
            set -e
            cd /Data/ponyc
            cmake --preset ${{env.PRESET_DEBUG}} -DPONY_USES=${{env.PONY_USES}} -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            cmake --build --preset ${{env.PRESET_DEBUG}}
            cmake --build --preset ${{env.PRESET_DEBUG}} --target pony-doc-tests pony-lint-tests pony-lsp-tests
            ctest --preset ${{env.PRESET_DEBUG}} -L ci-core
            ctest --preset ${{env.PRESET_DEBUG}} -R pony-doc-tests
            ctest --preset ${{env.PRESET_DEBUG}} -R pony-lint-tests
            ctest --preset ${{env.PRESET_DEBUG}} -R pony-lsp-tests
            cmake --preset ${{env.PRESET_RELEASE}} -DPONY_USES=${{env.PONY_USES}} -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DPONY_INSTALL_SYMLINKS=OFF
            cmake --build --preset ${{env.PRESET_RELEASE}}
            ctest --preset ${{env.PRESET_RELEASE}} -L ci-core
          EOF

      - name: Copy crash reports
        if: ${{ always() }}
        run: |
          mkdir -p "./crash-reports-$HAIKU_VERSION-$PONY_USE_OS_LLVM"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i haiku_vm_key -p 2222" \
            user@localhost:/boot/home/Desktop/*.report "./crash-reports-$HAIKU_VERSION-$PONY_USE_OS_LLVM/" \
            || true

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: crash-reports-${{ env.HAIKU_VERSION }}-OS_LLVM_${{ env.PONY_USE_OS_LLVM }}
          path: ./crash-reports-${{ env.HAIKU_VERSION }}-${{ env.PONY_USE_OS_LLVM }}/*.report
          if-no-files-found: ignore
          overwrite: true

      - name: Package - setup cache
        id: package-cache
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}.zip', steps.buildsetup.outputs.PACKAGE) }}
          key: ${{ format('{0}', steps.buildsetup.outputs.PACKAGE) }}

      - name: Package - create
        env:
          BUILD_PREFIX: /tmp/ponyc-build
          PACKAGE_DIR: /tmp/ponyc-pkg
          PACKAGE: ${{ steps.buildsetup.outputs.PACKAGE }}
          PACKAGE_REVISION: ${{ steps.buildsetup.outputs.PACKAGE_REVISION }}
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -i haiku_vm_key -p 2222 user@localhost /bin/sh <<EOF
            set -e
            cd /Data/ponyc
            export PACKAGE=$PACKAGE
            export PACKAGE_DIR=$PACKAGE_DIR
            export PACKAGE_REVISION=$PACKAGE_REVISION
            export BUILD_PREFIX=$BUILD_PREFIX
            mkdir -p "$BUILD_PREFIX"
            mkdir -p "$PACKAGE_DIR"
            cmake --install "build/build_${{env.PRESET_RELEASE}}" --prefix "$BUILD_PREFIX"
            bash .ci-scripts/haiku/haiku-package.bash
            echo "Package built in $PACKAGE_DIR/$PACKAGE.hpkg"
            package list "$PACKAGE_DIR/$PACKAGE.hpkg"
            mimeset -f "$PACKAGE_DIR/$PACKAGE.hpkg"
            zip -r -y -j "$PACKAGE_DIR/$PACKAGE.zip" "$PACKAGE_DIR/$PACKAGE.hpkg"
          EOF
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -i haiku_vm_key -P 2222 user@localhost:"$PACKAGE_DIR/$PACKAGE.zip" "$PACKAGE.zip"

      - name: Shutdown VM
        if: ${{ always() }}
        run: |
          pkill -f qemu-system-x86 || true

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.VERSION }}
          PACKAGE_REVISION: ${{ needs.build.outputs.PACKAGE_REVISION }}
        run: |
          gh release delete v$VERSION-$PACKAGE_REVISION -y --cleanup-tag || true
          gh release create v$VERSION-$PACKAGE_REVISION --notes "Pony $VERSION, build #$PACKAGE_REVISION for Haiku x86_64"

  upload:
    runs-on: ubuntu-latest
    needs: [ build, publish, haikuversions ]
    permissions:
      contents: write

    strategy:
      matrix:
        haiku-version: ["${{ needs.haikuversions.outputs.HAIKU_NIGHTLY_VERSION }}", "${{ needs.haikuversions.outputs.HAIKU_LTS_VERSION }}"]
        os-llvm: ['ON', 'OFF']

    name: Upload Haiku ${{ matrix.haiku-version }}, ${{ matrix.os-llvm == 'ON' && 'shared' || 'static' }} LLVM

    env:
      HAIKU_VERSION: ${{ matrix.haiku-version }}
      PONY_USE_OS_LLVM: ${{ matrix.os-llvm }}

    steps:
      - uses: actions/checkout@v7

      - name: prepare PACKAGE name
        id: package
        env:
          VERSION: ${{ needs.build.outputs.VERSION }}
          PACKAGE_REVISION: ${{ needs.build.outputs.PACKAGE_REVISION }}
        run: |
          # WARNING: this HAS TO be in-sync with buildsetup step from build job
          LLVM_INFO=
          if [ "$PONY_USE_OS_LLVM" != "ON" ] ; then
            LLVM_INFO="-static"
          fi
          export PACKAGE=ponyc-$VERSION-$PACKAGE_REVISION-$HAIKU_VERSION-x86_64$LLVM_INFO
          echo package is $PACKAGE
          echo PACKAGE=$PACKAGE >> $GITHUB_OUTPUT

      - name: Restore package from cache
        id: package-cache
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}.zip', steps.package.outputs.PACKAGE) }}
          key: ${{ format('{0}', steps.package.outputs.PACKAGE) }}

      - name: Upload
        if: ${{ steps.package-cache.outputs.cache-hit == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.VERSION }}
          PACKAGE_REVISION: ${{ needs.build.outputs.PACKAGE_REVISION }}
          PACKAGE: ${{ steps.package.outputs.PACKAGE }}
        run: |
          gh release upload v$VERSION-$PACKAGE_REVISION "$PACKAGE.zip"
